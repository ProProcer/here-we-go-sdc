name: Role 3 source discovery

on:
  schedule:
    - cron: '0 1 * * *' # 09:00 Asia/Kuala_Lumpur (UTC+8)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/role3-discovery.yml'
      - 'src/intelligence/discovery.py'
      - 'src/intelligence/gemini.py'
      - 'src/intelligence/source_review.py'
      - 'src/intelligence/skill_evidence.py'
      - 'src/intelligence/review_retrieval.py'
      - 'src/schemas/source_review.py'
      - 'src/schemas/skill_evidence.py'
      - 'data/processed/onet/31.0/catalog.json'
      - 'data/sources/skill_evidence_decisions.json'
      - 'data/sources/discovery_*.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: role3-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pydantic==2.12.3
      - name: Restore previous queue and candidate history
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          # Fall back to the committed initial queue if no retained artifact exists.
          gh run list --workflow role3-discovery.yml --branch main --status completed --limit 5 --json databaseId --jq '.[].databaseId' > /tmp/role3-runs.txt
          while read -r run_id; do
            if gh run download "$run_id" --name role3-discovery-state --dir /tmp/role3-state; then
              cp -R /tmp/role3-state/. data/review/discovery/
              break
            fi
          done < /tmp/role3-runs.txt
      - name: Discover reports and optionally extract approved sources
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS || 'gemini-3.5-flash-lite,gemini-3.6-flash,gemini-3.8-flash' }}
        shell: bash
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            python -m src.intelligence.discovery run --extract --max-extractions 3
          else
            python -m src.intelligence.discovery run
          fi
      - name: AI source checks and human review brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS || 'gemini-3.5-flash-lite,gemini-3.6-flash,gemini-3.8-flash' }}
        shell: bash
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            python -m src.intelligence.source_review run --max-reviews 3
          else
            python -m src.intelligence.source_review show
          fi
      - name: Assess new skills and changed evidence incrementally
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS || 'gemini-3.5-flash-lite,gemini-3.6-flash,gemini-3.8-flash' }}
        shell: bash
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            python -m src.intelligence.skill_evidence run --max-batches 3
          else
            python -m src.intelligence.skill_evidence show
          fi
      - name: Publish the human attention brief in the run summary
        if: always()
        shell: bash
        run: |
          if [ -f data/review/discovery/REVIEW_BRIEF.md ]; then
            cat data/review/discovery/REVIEW_BRIEF.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f data/review/discovery/SKILL_REVIEW_BRIEF.md ]; then
            cat data/review/discovery/SKILL_REVIEW_BRIEF.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save review queue and run receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: role3-discovery-state
          path: data/review/discovery/
          if-no-files-found: error
          retention-days: 90
